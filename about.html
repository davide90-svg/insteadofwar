<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About | Instead Of War</title>
<meta name="description" content="About the Instead Of War project and its founder." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
:root {
  --bg: #000000;
  --red: #ff3333;
  --white: #ffffff;
  --muted: #666666;
  --surface: #0a0a0a;
  --border: #1f1f1f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
  overflow-x: hidden;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 50px;
  margin-top: 20px;
  flex-wrap: wrap;
  gap: 20px;
}
.top-nav { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
.nav-btn {
  background: var(--surface);
  color: var(--white);
  border: 1px solid var(--border);
  font-weight: 700;
  text-decoration: none;
  padding: 10px 20px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.3s;
  font-size: 0.85rem;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.nav-btn:hover { border-color: var(--white); }
.nav-btn.primary {
  background: var(--red);
  color: #000;
  border: none;
  font-weight: 900;
  box-shadow: 0 0 15px rgba(255,51,51,0.3);
  font-size: 0.95rem;
}
.nav-btn.primary:hover { background: #ff4d4d; box-shadow: 0 0 25px rgba(255,51,51,0.6); }
select {
  background: var(--surface);
  color: var(--white);
  border: 1px solid var(--border);
  padding: 10px 15px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  font-size: 0.9rem;
  outline: none;
  transition: border 0.3s;
  min-height: 44px;
}
select:hover { border-color: var(--muted); }
.brand-container { text-align: center; margin-bottom: 40px; }
.brand { font-size: clamp(3rem, 10vw, 7rem); font-weight: 900; line-height: 0.85; letter-spacing: -4px; text-transform: uppercase; }
.subtitle { color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 18px; text-transform: uppercase; letter-spacing: 1px; }
.about-box {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: clamp(24px, 4vw, 48px);
}
.about-title {
  color: var(--red);
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 900;
  margin-bottom: 28px;
  text-transform: uppercase;
  line-height: 0.95;
}
.about-content p {
  color: var(--white);
  opacity: 0.88;
  margin-bottom: 18px;
  font-size: 1.05rem;
}
.about-content a {
  color: var(--white);
  text-decoration: underline;
}
.footer-back {
  margin-top: 24px;
  display: inline-flex;
}
@media (max-width: 768px) {
  .wrap { padding: 24px 16px 60px; }
  header {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    margin-top: 0;
    margin-bottom: 28px;
  }
  .top-nav {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    width: 100%;
    order: 2;
  }
  #langSelect {
    width: 100%;
    order: 1;
  }
  .nav-btn,
  .footer-back {
    width: 100%;
    justify-content: center;
    text-align: center;
  }
  .brand {
    line-height: 0.9;
    letter-spacing: -2px;
  }
  .about-content p { font-size: 1rem; }
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <nav class="top-nav">
      <a href="./index.html" class="nav-btn primary" id="t-nav-home">← HOME</a>
      <a href="./reports.html" class="nav-btn" id="t-nav-rep">📰 REPORTS</a>
      <a href="./index.html#get-involved" class="nav-btn" id="t-nav-get">🤝 GET INVOLVED</a>
    </nav>
    <select id="langSelect" aria-label="Select language">
      <option value="en">🇺🇸 ENGLISH</option>
      <option value="es">🇪🇸 ESPAÑOL</option>
      <option value="it">🇮🇹 ITALIANO</option>
      <option value="fr">🇫🇷 FRANÇAIS</option>
      <option value="de">🇩🇪 DEUTSCH</option>
      <option value="pt">🇵🇹 PORTUGUÊS</option>
    </select>
  </header>

  <div class="brand-container">
    <h1 class="brand">INSTEAD<br>OF<br><span style="color: var(--red);">WAR</span></h1>
    <p class="subtitle" id="t-subtitle">ABOUT THE PROJECT</p>
  </div>

  <section class="about-box" aria-labelledby="about-title">
    <h2 class="about-title" id="about-title">ABOUT</h2>
    <div class="about-content" id="about-content"></div>
    <a class="nav-btn footer-back" href="./index.html" id="t-back-home">← BACK HOME</a>
  </section>
</main>
<script>
let currentLang = (() => {
  try { return localStorage.getItem('lang') || 'en'; } catch (e) { return 'en'; }
})();
const aboutI18n = {
  en: {
    navHome: '← HOME', navRep: '📰 REPORTS', navGet: '🤝 GET INVOLVED', sub: 'ABOUT THE PROJECT', back: '← BACK HOME', title: 'ABOUT',
    body: `
      <p>My name is Davide Parisi. I'm not an academic, nor an activist by profession. I'm someone who has spent years working inside systems I fundamentally disagree with, thinking about what kind of world we're actually building — and what we're choosing not to build.</p>
      <p>This project was born from a simple conviction: every human being has an unalienable right to dignity. Not dignity as an abstract concept, but as something concrete — a decent home, guaranteed food, access to quality education, and healthcare. These aren't privileges. They're the baseline of what it means to be human.</p>
      <p>The numbers on this site are not metaphors. They are a choice made visible. Every second, humanity spends money on war — the most destructive and inhumane institution in our history — while the resources needed to guarantee dignity to every person on earth already exist. They are simply pointed in the wrong direction.</p>
      <p>I built this as a tool for those who need to see it clearly. If it moves something in you, I'd like to hear from you.</p>
      <p>✉️ <a href="mailto:insteadofwar@yahoo.com">insteadofwar@yahoo.com</a></p>
    `
  },
  es: {
    navHome: '← INICIO', navRep: '📰 INFORMES', navGet: '🤝 PARTICIPA', sub: 'SOBRE EL PROYECTO', back: '← VOLVER AL INICIO', title: 'SOBRE EL PROYECTO',
    body: `
      <p>Me llamo Davide Parisi. No soy académico, ni activista de profesión. Soy alguien que ha pasado años trabajando dentro de sistemas con los que discrepo profundamente, reflexionando sobre el tipo de mundo que estamos construyendo de verdad, y el que estamos eligiendo no construir.</p>
      <p>Este proyecto nace de una convicción muy sencilla: todo ser humano tiene un derecho inalienable a la dignidad. No a una dignidad entendida como un concepto abstracto, sino como una realidad tangible: un hogar en condiciones, comida garantizada, acceso a una educación de calidad y atención médica. No son privilegios. Son la base misma de lo que significa ser humano.</p>
      <p>Las cifras de esta página no son metáforas; son una elección que se ha hecho visible. Cada segundo, la humanidad gasta dinero en la guerra —la institución más destructiva e inhumana de nuestra historia— mientras que los recursos necesarios para garantizar la dignidad de cada persona del planeta ya existen. Simplemente están apuntando en la dirección equivocada.</p>
      <p>He creado esto como una herramienta para quienes necesitan verlo con claridad. Si esto resuena contigo, me encantaría contactes conmigo.</p>
      <p>✉️ <a href="mailto:insteadofwar@yahoo.com">insteadofwar@yahoo.com</a></p>
    `
  },
  it: {
    navHome: '← HOME', navRep: '📰 REPORT', navGet: '🤝 PARTECIPA', sub: 'SUL PROGETTO', back: '← TORNA ALLA HOME', title: 'CHI SIAMO',
    body: `
      <p>Mi chiamo Davide Parisi. Non sono un accademico, né un attivista di professione. Sono una persona che ha trascorso anni a lavorare all'interno di sistemi che non condivide affatto, riflettendo su che tipo di mondo stiamo realmente costruendo — e su cosa, invece, stiamo scegliendo di non costruire.</p>
      <p>Questo progetto nasce da una semplice convinzione: ogni essere umano ha un diritto inalienabile alla dignità. Non la dignità come concetto astratto, ma come qualcosa di concreto: una casa dignitosa, cibo garantito, accesso a un'istruzione di qualità e alle cure mediche. Questi non sono privilegi. Sono le basi stesse di ciò che significa essere umani.</p>
      <p>I numeri su questo sito non sono metafore. Sono una scelta resa visibile. Ogni secondo, l'umanità spende denaro per la guerra — l'istituzione più distruttiva e disumana della nostra storia — mentre le risorse necessarie per garantire dignità a ogni persona sulla terra esistono già. Sono semplicemente puntate nella direzione sbagliata.</p>
      <p>Ho costruito tutto questo come strumento per chi ha bisogno di vederci chiaro. Se smuove qualcosa dentro di te, mi farebbe piacere ascoltarti.</p>
      <p>✉️ <a href="mailto:insteadofwar@yahoo.com">insteadofwar@yahoo.com</a></p>
    `
  },
  fr: {
    navHome: '← ACCUEIL', navRep: '📰 RAPPORTS', navGet: '🤝 PARTICIPER', sub: 'À PROPOS DU PROJET', back: '← RETOUR À L’ACCUEIL', title: 'À PROPOS',
    body: `
      <p>Je m'appelle Davide Parisi. Je ne suis ni universitaire, ni militant de profession. Je suis quelqu'un qui a passé des années à travailler au cœur de systèmes avec lesquels je suis fondamentalement en désaccord, tout en réfléchissant au monde que nous sommes en train de bâtir — et à celui que nous choisissons d'ignorer.</p>
      <p>Ce projet est né d'une conviction simple : tout être humain a un droit inaliénable à la dignité. Pas une dignité abstraite, mais une réalité concrète : un logement décent, de la nourriture garantie, l'accès à une éducation de qualité et à des soins de santé. Ce ne sont pas des privilèges. C'est le fondement même de la condition humaine.</p>
      <p>Les chiffres que vous voyez sur ce site ne sont pas des métaphores. Ils rendent un choix visible. Chaque seconde, l'humanité dépense de l'argent pour la guerre — l'institution la plus destructrice et la plus inhumaine de notre histoire — alors que les ressources nécessaires pour garantir la dignité de chaque personne sur terre existent déjà. Elles sont simplement dirigées vers la mauvaise cible.</p>
      <p>J'ai conçu ce projet comme un outil pour ceux qui ont besoin de voir les choses clairement. Si cela résonne en vous, j'aimerais beaucoup avoir de vos nouvelles.</p>
      <p>✉️ <a href="mailto:insteadofwar@yahoo.com">insteadofwar@yahoo.com</a></p>
    `
  },
  de: {
    navHome: '← STARTSEITE', navRep: '📰 BERICHTE', navGet: '🤝 MITMACHEN', sub: 'ÜBER DAS PROJEKT', back: '← ZURÜCK ZUR STARTSEITE', title: 'ÜBER DAS PROJEKT',
    body: `
      <p>Mein Name ist Davide Parisi. Ich bin weder Akademiker noch von Beruf Aktivist. Ich bin jemand, der jahrelang in Systemen gearbeitet hat, die er im Grunde ablehnt, und der darüber nachgedacht hat, was für eine Welt wir eigentlich aufbauen – und worauf wir uns entscheiden, zu verzichten.</p>
      <p>Dieses Projekt entstand aus einer einfachen Überzeugung: Jeder Mensch hat ein unveräußerliches Recht auf Würde. Keine Würde als abstraktes Konzept, sondern als etwas Handfestes – ein anständiges Zuhause, garantierte Ernährung, Zugang zu hochwertiger Bildung und Gesundheitsversorgung. Das sind keine Privilegien. Sie sind das Fundament des Menschseins.</p>
      <p>Die Zahlen auf dieser Website sind keine Metaphern. Sie machen eine Entscheidung sichtbar. In jeder Sekunde gibt die Menschheit Geld für den Krieg aus – die zerstörerischste und unmenschlichste Institution unserer Geschichte –, während die Ressourcen, die nötig wären, um jedem Menschen auf der Erde ein würdevolles Leben zu garantieren, längst vorhanden sind. Sie werden nur in die falsche Richtung gelenkt.</p>
      <p>Ich habe dies als Werkzeug für all jene entwickelt, die es klar vor Augen haben müssen. Wenn es in dir etwas bewegt, würde ich mich freuen, von dir zu hören.</p>
      <p>✉️ <a href="mailto:insteadofwar@yahoo.com">insteadofwar@yahoo.com</a></p>
    `
  },
  pt: {
    navHome: '← INÍCIO', navRep: '📰 RELATÓRIOS', navGet: '🤝 PARTICIPAR', sub: 'SOBRE O PROJETO', back: '← VOLTAR AO INÍCIO', title: 'SOBRE O PROJETO',
    body: `
      <p>Meu nome é Davide Parisi. Não sou acadêmico, nem ativista de profissão. Sou alguém que passou anos trabalhando dentro de sistemas com os quais discordo profundamente, pensando sobre o tipo de mundo que estamos realmente construindo — e o que estamos escolhendo não construir.</p>
      <p>Este projeto nasceu de uma convicção simples: todo ser humano tem um direito inalienável à dignidade. Não a dignidade como um conceito abstrato, mas como algo concreto: uma moradia decente, alimentação garantida, acesso à educação de qualidade e saúde. Isso não é um privilégio. É a base do que significa ser humano.</p>
      <p>Os números neste site não são metáforas. Eles são uma escolha que se tornou visível. A cada segundo, a humanidade gasta dinheiro com a guerra — a instituição mais destrutiva e desumana da nossa história — enquanto os recursos necessários para garantir a dignidade a cada pessoa na Terra já existem. Eles apenas estão sendo apontados para a direção errada.</p>
      <p>Criei isso como uma ferramenta para quem precisa enxergar as coisas com clareza. Se isso mexer com você de alguma forma, eu adoraria ouvir o que tem a dizer.</p>
      <p>✉️ <a href="mailto:insteadofwar@yahoo.com">insteadofwar@yahoo.com</a></p>
    `
  }
};
function persistLang() {
  try { localStorage.setItem('lang', currentLang); } catch (e) {}
}
function updateAboutPage() {
  const lang = aboutI18n[currentLang] ? currentLang : 'en';
  const t = aboutI18n[lang];
  document.documentElement.lang = lang;
  document.getElementById('langSelect').value = lang;
  document.getElementById('t-nav-home').innerText = t.navHome;
  document.getElementById('t-nav-rep').innerText = t.navRep;
  document.getElementById('t-nav-get').innerText = t.navGet;
  document.getElementById('t-subtitle').innerText = t.sub;
  document.getElementById('t-back-home').innerText = t.back;
  document.getElementById('about-title').innerText = t.title;
  document.getElementById('about-content').innerHTML = t.body;
}
document.getElementById('langSelect').addEventListener('change', (e) => {
  currentLang = e.target.value;
  persistLang();
  updateAboutPage();
});
persistLang();
updateAboutPage();
</script>
</body>
</html>
