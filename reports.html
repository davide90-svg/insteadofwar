---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports | Instead Of War</title>
<meta name="description" content="Reports and articles from Instead Of War." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
:root {
  --bg: #000000;
  --red: #ff3333;
  --green: #00e676;
  --white: #ffffff;
  --muted: #666666;
  --surface: #0a0a0a;
  --border: #1f1f1f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  margin: 0;
  padding: 0;
  line-height: 1.6;
  overflow-x: hidden;
}
.wrap {
  max-width: 900px;
  margin: 50px auto;
  padding: 20px;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
  margin-bottom: 40px;
  gap: 20px;
  flex-wrap: wrap;
}
.top-nav {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
}
.nav-btn {
  background: var(--surface);
  color: var(--white);
  border: 1px solid var(--border);
  font-weight: 700;
  text-decoration: none;
  padding: 10px 20px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.3s;
  font-size: 0.85rem;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.nav-btn:hover { border-color: var(--white); }
.nav-btn.primary {
  background: var(--red);
  color: #000;
  border: none;
  font-weight: 900;
  box-shadow: 0 0 15px rgba(255,51,51,0.3);
  font-size: 0.95rem;
}
.nav-btn.primary:hover {
  background: #ff4d4d;
  box-shadow: 0 0 25px rgba(255,51,51,0.6);
}
select {
  background: var(--surface);
  color: var(--white);
  border: 1px solid var(--border);
  padding: 10px 15px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  outline: none;
  font-size: 0.9rem;
  min-height: 44px;
}
h1 {
  color: var(--red);
  text-transform: uppercase;
  font-weight: 900;
  font-size: clamp(2.2rem, 6vw, 4rem);
  margin-top: 0;
  margin-bottom: 10px;
  line-height: 0.95;
}
.subtitle {
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 35px;
  font-size: 0.9rem;
}
.post-list {
  list-style: none;
  padding: 0;
}
.post-list li {
  border-bottom: 1px solid var(--border);
  padding: 22px 0;
}
.post-link {
  color: var(--white);
  text-decoration: none;
  font-size: 1.35rem;
  font-weight: 700;
  line-height: 1.3;
}
.post-link:hover {
  color: var(--green);
}
.post-date {
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  display: block;
  margin-top: 7px;
  font-size: 0.9rem;
}
.empty-state {
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 28px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.hidden {
  display: none !important;
}
@media (max-width: 768px) {
  .wrap {
    margin: 20px auto;
    padding: 16px;
  }
  .header-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 28px;
  }
  .top-nav {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    width: 100%;
    order: 2;
  }
  #blogLangSelect {
    width: 100%;
    order: 1;
  }
  .nav-btn {
    width: 100%;
    text-align: center;
  }
  .post-link {
    font-size: 1.1rem;
  }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="header-bar">
      <nav class="top-nav">
        <a href="./index.html" class="nav-btn primary" id="t-nav-home">← BACK TO LIVE DATA</a>
        <a href="./about.html" class="nav-btn" id="t-nav-about">📖 ABOUT</a>
      </nav>
      <select id="blogLangSelect" aria-label="Select language">
        <option value="en">🇺🇸 ENGLISH</option>
        <option value="es">🇪🇸 ESPAÑOL</option>
        <option value="it">🇮🇹 ITALIANO</option>
        <option value="fr">🇫🇷 FRANÇAIS</option>
        <option value="de">🇩🇪 DEUTSCH</option>
        <option value="pt">🇵🇹 PORTUGUÊS</option>
      </select>
    </div>

    <h1 id="t-title">INSTEAD OF WAR - REPORTS</h1>
    <p class="subtitle" id="t-subtitle">ARTICLES AND REPORTS BY LANGUAGE</p>

    <ul class="post-list" id="postList">
      {% for post in site.posts %}
        <li class="post-item" data-lang="{{ post.lang | default: 'en' }}">
          <a class="post-link" href="{{ post.url }}">{{ post.title }}</a>
          <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
        </li>
      {% endfor %}
    </ul>

    <div class="empty-state hidden" id="emptyState">NO REPORTS AVAILABLE IN THIS LANGUAGE.</div>
  </div>
<script>
let currentLang = (() => {
  try { return localStorage.getItem('lang') || 'en'; } catch (e) { return 'en'; }
})();
const reportsI18n = {
  en: { navHome: '← BACK TO LIVE DATA', navAbout: '📖 ABOUT', title: 'INSTEAD OF WAR - REPORTS', subtitle: 'ARTICLES AND REPORTS BY LANGUAGE', empty: 'NO REPORTS AVAILABLE IN THIS LANGUAGE.' },
  es: { navHome: '← VOLVER A LOS DATOS EN VIVO', navAbout: '📖 SOBRE EL PROYECTO', title: 'INSTEAD OF WAR - REPORTAJES', subtitle: 'ARTÍCULOS Y REPORTAJES POR IDIOMA', empty: 'NO HAY REPORTAJES DISPONIBLES EN ESTE IDIOMA.' },
  it: { navHome: '← TORNA AI DATI IN TEMPO REALE', navAbout: '📖 CHI SIAMO', title: 'INSTEAD OF WAR - REPORT', subtitle: 'ARTICOLI E REPORT PER LINGUA', empty: 'NON CI SONO REPORT DISPONIBILI IN QUESTA LINGUA.' },
  fr: { navHome: '← RETOUR AUX DONNÉES EN DIRECT', navAbout: '📖 À PROPOS', title: 'INSTEAD OF WAR - RAPPORTS', subtitle: 'ARTICLES ET RAPPORTS PAR LANGUE', empty: 'AUCUN RAPPORT DISPONIBLE DANS CETTE LANGUE.' },
  de: { navHome: '← ZURÜCK ZU LIVE-DATEN', navAbout: '📖 ÜBER DAS PROJEKT', title: 'INSTEAD OF WAR - BERICHTE', subtitle: 'ARTIKEL UND BERICHTE NACH SPRACHE', empty: 'KEINE BERICHTE IN DIESER SPRACHE VERFÜGBAR.' },
  pt: { navHome: '← VOLTAR AOS DADOS EM TEMPO REAL', navAbout: '📖 SOBRE O PROJETO', title: 'INSTEAD OF WAR - RELATÓRIOS', subtitle: 'ARTIGOS E RELATÓRIOS POR IDIOMA', empty: 'NÃO HÁ RELATÓRIOS DISPONÍVEIS NESTE IDIOMA.' }
};
const langSelect = document.getElementById('blogLangSelect');
const posts = document.querySelectorAll('.post-item');
const emptyState = document.getElementById('emptyState');
function persistLang() {
  try { localStorage.setItem('lang', currentLang); } catch (e) {}
}
function updateStaticTexts() {
  const lang = reportsI18n[currentLang] ? currentLang : 'en';
  const t = reportsI18n[lang];
  document.documentElement.lang = lang;
  langSelect.value = lang;
  document.getElementById('t-nav-home').innerText = t.navHome;
  document.getElementById('t-nav-about').innerText = t.navAbout;
  document.getElementById('t-title').innerText = t.title;
  document.getElementById('t-subtitle').innerText = t.subtitle;
  emptyState.innerText = t.empty;
}
function filterPosts(lang) {
  let visibleCount = 0;
  posts.forEach(post => {
    if (post.getAttribute('data-lang') === lang) {
      post.classList.remove('hidden');
      visibleCount++;
    } else {
      post.classList.add('hidden');
    }
  });
  if (visibleCount === 0) emptyState.classList.remove('hidden');
  else emptyState.classList.add('hidden');
}
langSelect.addEventListener('change', (e) => {
  currentLang = e.target.value;
  persistLang();
  updateStaticTexts();
  filterPosts(currentLang);
});
persistLang();
updateStaticTexts();
filterPosts(currentLang);
</script>
</body>
</html>
